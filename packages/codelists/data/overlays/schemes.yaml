# Editorial additions to the generated identifier-scheme lists
# (data/codelists/icd-schemes.yaml, data/codelists/eas-schemes.yaml).
#
# Keyed by code; applies to whichever list(s) carry the code (an EAS 0xxx
# code is the same scheme as ICD 0xxx). Everything here is optional:
#   preferred  float the scheme to the top of its relevant group
#   label      per-locale override of the published name (short, readable)
#   hint       per-locale explanation shown with the option
#   country    for a scheme no upstream tags with a country (ISO-2 or
#              "international"); fails once upstream supplies one
# A code no list carries fails `npm run generate` (stale entry).
name: Identifier scheme overlay
entries:
  - code: "0002"
    hint:
      en: "9-digit French legal-entity identifier (SIREN). Use SIRET (0009) when the establishment-level suffix matters."
      de: "9-stellige französische Kennung der juristischen Person (SIREN). Für die etablissementbezogene Variante SIRET (0009) wählen."
  - code: "0007"
    label: { en: "Organisationsnummer (SE)", de: "Organisationsnummer (SE)" }
  - code: "0009"
    preferred: true
    label: { en: "SIRET (FR)", de: "SIRET (FR)" }
    hint:
      en: "14-digit French establishment identifier (SIREN + 5-digit suffix). Identifies a specific site, not just the legal entity."
      de: "14-stellige französische Etablissement-Kennung (SIREN + 5-stelliger Zusatz). Identifiziert einen konkreten Standort, nicht nur die juristische Person."
  - code: "0037"
    label: { en: "LY-tunnus (FI)", de: "LY-tunnus (FI)" }
  - code: "0060"
    preferred: true
    label: { en: "D-U-N-S Number", de: "D-U-N-S-Nummer" }
    hint:
      en: "Dun & Bradstreet global business identifier. Frequently requested by US and large international buyers."
      de: "Globale Unternehmenskennung von Dun & Bradstreet. Häufig von US-amerikanischen und internationalen Großkunden verlangt."
  - code: "0088"
    preferred: true
    label: { en: "GLN (Global Location Number)", de: "GLN (Global Location Number)" }
    hint:
      en: "GS1 location identifier; the standard pick in retail, logistics, and healthcare supply chains."
      de: "GS1-Standortkennung; Standard im Einzelhandel, in der Logistik und in Gesundheits-Lieferketten."
  - code: "0096"
    label: { en: "DK Chamber of Commerce", de: "Dänische Handelskammer" }
  - code: "0097"
    label: { en: "FTI - Ediforum Italia", de: "FTI - Ediforum Italia" }
  - code: "0106"
    label: { en: "KVK (NL Chamber of Commerce)", de: "KVK (Niederländische Handelskammer)" }
    hint:
      en: "Dutch chamber-of-commerce registration number — the standard B2B identifier in the Netherlands."
      de: "Niederländische Handelskammer-Registrierungsnummer — übliche B2B-Kennung in den Niederlanden."
  - code: "0151"
    label: { en: "ABN (Australia)", de: "ABN (Australien)" }
  - code: "0160"
    preferred: true
    country: "international"
    label: { en: "GTIN", de: "GTIN" }
    hint:
      en: "GS1 product barcode (EAN/UPC superset). Use for retail items, not for parties or locations."
      de: "GS1-Produkt-Barcode (Obermenge von EAN/UPC). Für Handelsware geeignet, nicht für Parteien oder Standorte."
  - code: "0183"
    preferred: true
    label: { en: "IDE / UID (CH)", de: "IDE / UID (CH)" }
    hint:
      en: "Swiss enterprise identification number (UID/IDE). Mandatory on Swiss commercial invoices."
      de: "Schweizer Unternehmens-Identifikationsnummer (UID/IDE). Auf Schweizer Handelsrechnungen vorgeschrieben."
  - code: "0184"
    preferred: true
    label: { en: "CVR (DK)", de: "CVR (DK)" }
    hint:
      en: "Danish central business register number — the standard B2B identifier in Denmark."
      de: "Dänische zentrale Unternehmensregisternummer — übliche B2B-Kennung in Dänemark."
  - code: "0190"
    label: { en: "OIN (NL)", de: "OIN (NL)" }
    hint:
      en: "Dutch public-sector identifier. Required when invoicing Dutch government bodies."
      de: "Niederländische Kennung des öffentlichen Sektors. Bei Rechnungen an niederländische Behörden erforderlich."
  - code: "0191"
    label: { en: "Registry code (EE)", de: "Registrierungscode (EE)" }
  - code: "0192"
    preferred: true
    label: { en: "Enhetsregisteret (NO)", de: "Enhetsregisteret (NO)" }
    hint:
      en: "Norwegian central enterprise register number — the standard B2B identifier in Norway."
      de: "Norwegische zentrale Unternehmensregisternummer — übliche B2B-Kennung in Norwegen."
  - code: "0193"
    label: { en: "UBL.BE party identifier", de: "UBL.BE-Parteikennung" }
  - code: "0195"
    label: { en: "UEN (Singapore)", de: "UEN (Singapur)" }
  - code: "0196"
    label: { en: "Kennitala (IS)", de: "Kennitala (IS)" }
  - code: "0198"
    label: { en: "ERSTORG (DK)", de: "ERSTORG (DK)" }
  - code: "0199"
    preferred: true
    label: { en: "LEI (Legal Entity Identifier)", de: "LEI (Legal Entity Identifier)" }
    hint:
      en: "20-character ISO identifier for legal entities. Required by EU regulations for financial counterparties (banks, insurers, funds)."
      de: "20-stellige ISO-Kennung für juristische Personen. Nach EU-Vorgaben für Finanzgegenparteien (Banken, Versicherer, Fonds) verpflichtend."
  - code: "0200"
    label: { en: "Legal entity code", de: "Legal entity code" }
  - code: "0201"
    label: { en: "Codice Univoco UO (IT)", de: "Codice Univoco UO (IT)" }
  - code: "0202"
    label: { en: "PEC of public administration (IT)", de: "PEC der öffentlichen Verwaltung (IT)" }
  - code: "0204"
    preferred: true
    label: { en: "Leitweg-ID (DE)", de: "Leitweg-ID (DE)" }
    hint:
      en: "Required by German federal and most state public-sector buyers — it routes the invoice to the correct receiving office."
      de: "Erforderlich bei Bund und den meisten Ländern in Deutschland — leitet die Rechnung an die richtige Empfangsstelle."
  - code: "0208"
    label: { en: "Enterprise number (BE)", de: "Unternehmensnummer (BE)" }
    hint:
      en: "Belgian KBO/BCE enterprise number — the standard B2B identifier in Belgium."
      de: "Belgische KBO/BCE-Unternehmensnummer — übliche B2B-Kennung in Belgien."
  - code: "0209"
    label: { en: "GS1 identification key", de: "GS1-Identifikationsschlüssel" }
  - code: "0210"
    label: { en: "Codice Fiscale (IT)", de: "Codice Fiscale (IT)" }
    hint:
      en: "Italian fiscal code (16 alphanumeric for individuals, 11 digits for companies). Different from Partita IVA — use 0211 for the VAT number."
      de: "Italienische Steuernummer (16 alphanumerisch für Personen, 11-stellig für Unternehmen). Für die USt-IdNr. 0211 verwenden."
  - code: "0211"
    preferred: true
    label: { en: "Partita IVA (IT)", de: "Partita IVA (IT)" }
    hint:
      en: "11-digit Italian VAT number. Use 0210 for the Codice Fiscale."
      de: "11-stellige italienische USt-IdNr. Für den Codice Fiscale 0210 verwenden."
  - code: "0212"
    label: { en: "Organization identifier (FI)", de: "Organisationskennung (FI)" }
  - code: "0213"
    label: { en: "Organization VAT identifier (FI)", de: "Umsatzsteuerkennung der Organisation (FI)" }
  - code: "0218"
    label: { en: "Unified registration number", de: "Unified registration number" }
  - code: "0225"
    label: { en: "FRCTC Electronic Address", de: "FRCTC Electronic Address" }
  - code: "0240"
    label: { en: "Register of legal persons", de: "Register of legal persons" }
  - code: "0242"
    label: { en: "OpenPeppol Service Provider Identification Scheme", de: "OpenPeppol Service Provider Identification Scheme" }
  - code: "0244"
    label: { en: "Tax Identification (Tax ID)", de: "Tax Identification (Tax ID)" }
  - code: "0245"
    label: { en: "Tax identification number (DIČ)", de: "Tax identification number (DIČ)" }
  - code: "0246"
    hint:
      en: "Electronic business address for German B2B routing. Use 0204 (Leitweg-ID) for German public-sector buyers."
      de: "Elektronische Geschäftsadresse für deutsches B2B-Routing. Für deutsche öffentliche Auftraggeber stattdessen 0204 (Leitweg-ID) verwenden."
  - code: "9910"
    label: { de: "USt-IdNr. Ungarn" }
  - code: "9914"
    preferred: true
    label: { en: "Austria VAT number", de: "USt-IdNr. Österreich" }
    hint:
      en: "Austrian VAT identification number (UID). Format starts with \"ATU\" followed by 8 digits."
      de: "Österreichische Umsatzsteuer-Identifikationsnummer (UID). Format \"ATU\" plus 8 Ziffern."
  - code: "9915"
    label: { en: "Austria org. identifier (PA)", de: "Org.-Kennung Österreich (öff. Verwaltung)" }
  - code: "9919"
    label: { en: "Kennziffer des Unternehmensregisters (AT)", de: "Kennziffer des Unternehmensregisters (AT)" }
    hint:
      en: "Austrian company register number (KUR). Not the German Handelsregister, which has no scheme code: state an HRB number without a scheme."
      de: "Österreichische Kennziffer des Unternehmensregisters (KUR). Nicht das deutsche Handelsregister: dafür gibt es keinen Schema-Code, die HRB-Nummer steht ohne Schema."
  - code: "9920"
    label: { en: "Spain VAT number", de: "USt-IdNr. Spanien" }
  - code: "9922"
    label: { de: "USt-IdNr. Andorra" }
  - code: "9923"
    label: { de: "USt-IdNr. Albanien" }
  - code: "9930"
    preferred: true
    label: { de: "USt-IdNr. Deutschland" }
    hint:
      en: "German VAT identification number (USt-IdNr.). Use 0204 (Leitweg-ID) instead when invoicing German public-sector buyers."
      de: "Deutsche Umsatzsteuer-Identifikationsnummer. Für deutsche öffentliche Auftraggeber stattdessen 0204 (Leitweg-ID) verwenden."
  - code: "9931"
    label: { en: "Greece VAT number", de: "USt-IdNr. Griechenland" }
  - code: "9932"
