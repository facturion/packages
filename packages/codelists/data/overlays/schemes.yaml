  - code: "9946"
    label: { en: "Poland VAT number", de: "USt-IdNr. Polen" }
  - code: "9947"
    label: { en: "Portugal VAT number", de: "USt-IdNr. Portugal" }
  - code: "9948"
    label: { en: "Romania VAT number", de: "USt-IdNr. Rumänien" }
  - code: "9952"
    label: { en: "Sweden VAT number", de: "USt-IdNr. Schweden" }
  - code: "9957"
    label: { en: "France VAT number", de: "USt-IdNr. Frankreich" }
  - code: "EM"
    preferred: true
    country: "international"
    label: { en: "E-mail", de: "E-Mail" }
    hint:
      en: "An e-mail address as the electronic address. Common for invoices sent by e-mail rather than through a network such as Peppol."
      de: "Eine E-Mail-Adresse als elektronische Adresse. Üblich, wenn die Rechnung per E-Mail statt über ein Netzwerk wie Peppol zugestellt wird."
